<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>shell-proxy · terminal</title>
  <link rel="stylesheet" href="/assets/xterm.css" />
  <style>
    :root {
      --bg: #0a0d12;
      --panel: #0e141c;
      --line: #1f2836;
      --fg: #cdd7e1;
      --dim: #77828f;
      --amber: #ffb454;   /* this page's circuit: live PTY */
      --green: #4adfa4;   /* the stateless circuit, used to point at /console */
      --red: #ff7069;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      font: 13px ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
      color: var(--fg);
    }
    header {
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 10px;
      user-select: none;
    }
    .led {
      width: 9px; height: 9px; border-radius: 50%; flex: none;
      background: var(--dim);
      box-shadow: none;
    }
    body[data-conn="open"] .led { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
    body[data-conn="closed"] .led { background: var(--red); box-shadow: 0 0 8px var(--red); }
    header .title { color: var(--dim); font-size: 12px; }
    .mode {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--amber);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 1px 7px;
      background: var(--panel);
    }
    header .spacer { flex: 1; }
    header .status {
      font-size: 12px;
      color: var(--dim);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 10px;
      background: var(--panel);
    }
    header .status.open { color: var(--amber); border-color: rgba(255, 180, 84, .4); }
    header .status.closed { color: var(--red); border-color: rgba(255, 112, 105, .45); }
    header a {
      color: var(--green);
      text-decoration: none;
      font-size: 12px;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 9px;
      transition: border-color .15s;
    }
    header a:hover, header a:focus-visible { border-color: var(--green); outline: none; }
    #wrap { flex: 1; padding: 10px 12px 12px; overflow: hidden; }
    #terminal { width: 100%; height: 100%; }
    #terminal .xterm-viewport { scrollbar-color: var(--line) transparent; scrollbar-width: thin; }

    @media (prefers-reduced-motion: no-preference) {
      body[data-conn="open"] .led { animation: breathe 2.6s ease-in-out infinite; }
      @keyframes breathe { 50% { box-shadow: 0 0 3px var(--amber); } }
    }
  </style>
</head>
<body data-conn="connecting">
  <header>
    <span class="led"></span>
    <span class="title" id="host">interactive</span>
    <span class="mode">live pty</span>
    <span class="spacer"></span>
    <a href="/console">↩ stateless console</a>
    <span class="status" id="status">connecting…</span>
  </header>
  <div id="wrap"><div id="terminal"></div></div>

  <script src="/assets/xterm.js"></script>
  <script src="/assets/addon-fit.js"></script>
  <script>
    (function () {
      const statusEl = document.getElementById('status');
      document.getElementById('host').textContent = location.host + ' | interactive';

      const term = new Terminal({
        cursorBlink: true,
        fontFamily: 'ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace',
        fontSize: 13,
        theme: {
          background: '#0a0d12',
          foreground: '#cdd7e1',
          cursor: '#ffb454',
          cursorAccent: '#0a0d12',
          selectionBackground: '#264f78'
        }
      });
      const fit = new FitAddon.FitAddon();
      term.loadAddon(fit);
      term.open(document.getElementById('terminal'));
      fit.fit();

      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(proto + '://' + location.host + '/pty');
      ws.binaryType = 'arraybuffer';

      function setStatus(text, cls) {
        statusEl.textContent = text;
        statusEl.className = 'status' + (cls ? ' ' + cls : '');
        document.body.dataset.conn = cls || 'connecting';
      }

      function sendResize() {
        if (ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({ cols: term.cols, rows: term.rows }));
      }

      ws.onopen = function () {
        setStatus('connected', 'open');
        sendResize();
        term.focus();
      };

      ws.onmessage = function (ev) {
        if (typeof ev.data === 'string') {
          term.write(ev.data);
        } else {
          term.write(new Uint8Array(ev.data));
        }
      };

      ws.onclose = function () {
        setStatus('session closed', 'closed');
        term.write('\r\n\x1b[31m[session closed]\x1b[0m\r\n');
      };

      ws.onerror = function () { setStatus('connection error', 'closed'); };

      // Keystrokes -> server as binary frames.
      term.onData(function (data) {
        if (ws.readyState === WebSocket.OPEN) ws.send(new TextEncoder().encode(data));
      });

      window.addEventListener('resize', function () { fit.fit(); sendResize(); });
      term.onResize(sendResize);
    })();
  </script>
</body>
</html>
