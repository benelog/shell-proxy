<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>shell-proxy · console</title>
  <style>
    :root {
      --bg: #0a0d12;
      --panel: #0e141c;
      --line: #1f2836;
      --fg: #cdd7e1;
      --dim: #77828f;
      --green: #4adfa4;   /* this page's circuit: stateless */
      --amber: #ffb454;   /* the live PTY circuit, used to point at /term */
      --red: #ff7069;
      --sel: #264f78;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.5 ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 10px;
      user-select: none;
    }
    .led {
      width: 9px; height: 9px; border-radius: 50%; flex: none;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }
    header .title { color: var(--dim); font-size: 12px; }
    .mode {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--green);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 1px 7px;
      background: var(--panel);
    }
    header .spacer { flex: 1; }
    header .status {
      font-size: 12px;
      color: var(--green);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 10px;
      background: var(--panel);
    }
    header .status.busy { color: var(--amber); border-color: rgba(255, 180, 84, .4); }
    /* Shown only when the server was started with --interactive; the server
       flips the attribute on <body> as it serves this page. */
    header .nav-link {
      display: none;
      font-size: 12px;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 9px;
      color: var(--amber);
      transition: border-color .15s;
    }
    header .nav-link:hover, header .nav-link:focus-visible { border-color: var(--amber); outline: none; }
    header .nav-link.home { color: var(--dim); }
    header .nav-link.home:hover, header .nav-link.home:focus-visible { border-color: var(--dim); }
    body[data-interactive="true"] header .nav-link { display: inline-block; }

    #terminal {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #terminal::selection, #terminal *::selection { background: var(--sel); }
    .cmd-line { margin-top: 10px; font-weight: 700; }
    .cmd-line:first-child { margin-top: 0; }
    .cmd-line .prompt { color: var(--green); }
    .stderr { color: var(--red); }
    .meta { color: var(--dim); font-size: 12px; }
    .exit-chip {
      display: inline-block;
      margin-top: 4px;
      font-size: 12px;
      font-weight: 700;
      color: var(--red);
      border: 1px solid rgba(255, 112, 105, .45);
      border-radius: 4px;
      padding: 0 8px;
      background: rgba(255, 112, 105, .08);
    }

    .input-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 6px 16px 16px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      transition: border-color .15s, box-shadow .15s;
    }
    .input-row:focus-within {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(74, 223, 164, .12);
    }
    .input-row .prompt { color: var(--green); font-weight: 700; flex: none; }
    #input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--fg);
      font: inherit;
      caret-color: var(--green);
    }
    #input::placeholder { color: var(--dim); }
    #input:disabled { opacity: .5; }
    a { color: var(--green); }

    @media (prefers-reduced-motion: no-preference) {
      .led { animation: breathe 2.6s ease-in-out infinite; }
      @keyframes breathe { 50% { box-shadow: 0 0 3px var(--green); } }
      .line { animation: appear .18s ease-out; }
      @keyframes appear { from { opacity: 0; transform: translateY(3px); } }
    }
  </style>
</head>
<body data-interactive="false">
  <header>
    <span class="led"></span>
    <span class="title" id="host">shell-proxy</span>
    <span class="mode">stateless</span>
    <span class="spacer"></span>
    <a class="nav-link" href="/term" title="vi, top and other full-screen programs need a real terminal">⌨ live terminal</a>
    <a class="nav-link home" href="/" title="compare the two modes">↩ modes</a>
    <span class="status" id="status">ready</span>
  </header>

  <div id="terminal" aria-live="polite"></div>

  <div class="input-row">
    <span class="prompt">$</span>
    <input id="input" autocomplete="off" autocapitalize="off" autocorrect="off"
           spellcheck="false" placeholder="type a command and press Enter…" autofocus />
  </div>

  <script>
    (function () {
      const term = document.getElementById('terminal');
      const input = document.getElementById('input');
      const status = document.getElementById('status');
      const history = [];
      let histIdx = 0;

      document.getElementById('host').textContent = location.host + ' | shell-proxy';

      function scroll() { term.scrollTop = term.scrollHeight; }

      function append(text, cls) {
        if (text === '' || text == null) return;
        const div = document.createElement('div');
        div.className = 'line' + (cls ? ' ' + cls : '');
        div.textContent = text.replace(/\n$/, '');
        term.appendChild(div);
      }

      function echoCommand(cmd) {
        const div = document.createElement('div');
        div.className = 'line cmd-line';
        const p = document.createElement('span');
        p.className = 'prompt';
        p.textContent = '$ ';
        div.appendChild(p);
        div.appendChild(document.createTextNode(cmd));
        term.appendChild(div);
      }

      // Braille spinner in the status pill while a command runs. Falls back
      // to static text when the user prefers reduced motion.
      const frames = ['⠋', '⠙', '⠹', '⠸', '⠼', '⠴', '⠦', '⠧', '⠇', '⠏'];
      const animate = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let spinTimer = null, spinIdx = 0;

      function setBusy(busy) {
        clearInterval(spinTimer);
        spinTimer = null;
        if (busy && animate) {
          spinTimer = setInterval(function () {
            spinIdx = (spinIdx + 1) % frames.length;
            status.textContent = frames[spinIdx] + ' running';
          }, 90);
        }
        status.textContent = busy ? (animate ? '⠋ running' : 'running…') : 'ready';
        status.className = 'status' + (busy ? ' busy' : '');
        input.disabled = busy;
        if (!busy) input.focus();
      }

      async function run(cmd) {
        echoCommand(cmd);

        if (cmd === 'clear' || cmd === 'cls') {
          term.innerHTML = '';
          return;
        }

        setBusy(true);
        try {
          const resp = await fetch('/exec?command=' + encodeURIComponent(cmd));
          if (!resp.ok) {
            append('request failed: HTTP ' + resp.status, 'stderr');
            return;
          }
          const r = await resp.json();
          append(r.standardOutput);
          append(r.standardError, 'stderr');
          if (r.timedOut) append('(command timed out)', 'stderr');
          if (r.exitCode !== 0) append('exit ' + r.exitCode, 'exit-chip');
        } catch (e) {
          append('error: ' + e.message, 'stderr');
        } finally {
          setBusy(false);
          scroll();
        }
      }

      input.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') {
          const cmd = input.value.trim();
          input.value = '';
          if (!cmd) return;
          history.push(cmd);
          histIdx = history.length;
          run(cmd).then(scroll);
        } else if (ev.key === 'ArrowUp') {
          if (histIdx > 0) { histIdx--; input.value = history[histIdx]; }
          ev.preventDefault();
        } else if (ev.key === 'ArrowDown') {
          if (histIdx < history.length - 1) { histIdx++; input.value = history[histIdx]; }
          else { histIdx = history.length; input.value = ''; }
          ev.preventDefault();
        }
      });

      term.addEventListener('click', function () {
        if (window.getSelection().isCollapsed) input.focus();
      });

      append('shell-proxy: type a shell command below. "clear" wipes the screen.', 'meta');
      scroll();
    })();
  </script>
</body>
</html>
