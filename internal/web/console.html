<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>shell-proxy</title>
  <style>
    :root {
      --bg: #0b0e14;
      --fg: #d7dce2;
      --dim: #7a8595;
      --accent: #5cc8ff;
      --prompt: #7ee787;
      --err: #ff7b72;
      --sel: #264f78;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.5 "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 8px 14px;
      border-bottom: 1px solid #1c2230;
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .dot.r { background: #ff5f56; } .dot.y { background: #ffbd2e; } .dot.g { background: #27c93f; }
    header .title { margin-left: 8px; color: var(--dim); font-size: 12px; }
    header .spacer { flex: 1; }
    header .status { font-size: 12px; color: var(--dim); }
    header .status.busy { color: var(--accent); }
    /* Shown only when the server was started with --interactive; the server
       flips data-interactive on <body> as it serves this page. */
    header .nav-link { display: none; font-size: 12px; text-decoration: none; }
    body[data-interactive="true"] header .nav-link { display: inline; }
    #terminal {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #terminal::selection, #terminal *::selection { background: var(--sel); }
    .line { }
    .cmd-line { color: var(--fg); }
    .cmd-line .prompt { color: var(--prompt); }
    .stderr { color: var(--err); }
    .meta { color: var(--dim); font-size: 12px; }
    .input-row {
      display: flex;
      align-items: baseline;
      padding: 4px 14px 14px;
      gap: 8px;
    }
    .input-row .prompt { color: var(--prompt); flex: none; }
    #input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--fg);
      font: inherit;
      caret-color: var(--accent);
    }
    a { color: var(--accent); }
  </style>
</head>
<body data-interactive="false">
  <header>
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="title" id="host">shell-proxy</span>
    <span class="spacer"></span>
    <span class="status" id="status">ready</span>
    <a class="nav-link" href="/term" title="vi, top and other full-screen programs need a real terminal">⌨ interactive terminal</a>
    <a class="nav-link" href="/" title="compare the two modes">↩ modes</a>
  </header>

  <div id="terminal" aria-live="polite"></div>

  <div class="input-row">
    <span class="prompt">$</span>
    <input id="input" autocomplete="off" autocapitalize="off" autocorrect="off"
           spellcheck="false" placeholder="type a command and press Enter…" autofocus />
  </div>

  <script>
    (function () {
      const term = document.getElementById('terminal');
      const input = document.getElementById('input');
      const status = document.getElementById('status');
      const history = [];
      let histIdx = 0;

      document.getElementById('host').textContent = location.host + ' | shell-proxy';

      function scroll() { term.scrollTop = term.scrollHeight; }

      function append(text, cls) {
        if (text === '' || text == null) return;
        const div = document.createElement('div');
        div.className = 'line' + (cls ? ' ' + cls : '');
        div.textContent = text.replace(/\n$/, '');
        term.appendChild(div);
      }

      function echoCommand(cmd) {
        const div = document.createElement('div');
        div.className = 'line cmd-line';
        const p = document.createElement('span');
        p.className = 'prompt';
        p.textContent = '$ ';
        div.appendChild(p);
        div.appendChild(document.createTextNode(cmd));
        term.appendChild(div);
      }

      function setBusy(busy) {
        status.textContent = busy ? 'running…' : 'ready';
        status.className = 'status' + (busy ? ' busy' : '');
        input.disabled = busy;
        if (!busy) input.focus();
      }

      async function run(cmd) {
        echoCommand(cmd);

        if (cmd === 'clear' || cmd === 'cls') {
          term.innerHTML = '';
          return;
        }

        setBusy(true);
        try {
          const resp = await fetch('/exec?command=' + encodeURIComponent(cmd));
          if (!resp.ok) {
            append('request failed: HTTP ' + resp.status, 'stderr');
            return;
          }
          const r = await resp.json();
          append(r.standardOutput);
          append(r.standardError, 'stderr');
          if (r.timedOut) append('(command timed out)', 'stderr');
          if (r.exitCode !== 0) append('[exit code ' + r.exitCode + ']', 'meta');
        } catch (e) {
          append('error: ' + e.message, 'stderr');
        } finally {
          setBusy(false);
          scroll();
        }
      }

      input.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') {
          const cmd = input.value.trim();
          input.value = '';
          if (!cmd) return;
          history.push(cmd);
          histIdx = history.length;
          run(cmd).then(scroll);
        } else if (ev.key === 'ArrowUp') {
          if (histIdx > 0) { histIdx--; input.value = history[histIdx]; }
          ev.preventDefault();
        } else if (ev.key === 'ArrowDown') {
          if (histIdx < history.length - 1) { histIdx++; input.value = history[histIdx]; }
          else { histIdx = history.length; input.value = ''; }
          ev.preventDefault();
        }
      });

      term.addEventListener('click', function () {
        if (window.getSelection().isCollapsed) input.focus();
      });

      append('shell-proxy: type a shell command below. "clear" wipes the screen.', 'meta');
      scroll();
    })();
  </script>
</body>
</html>
